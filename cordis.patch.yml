# dsh-plugin-file-events bundle patch: contributes the plugin row into the
# host composition when this package is installed via `dsh plugin add`.
#
# The plugin is HOST-PLANE: it reads host services (storageDomain,
# workspaceRegistry, agents, agentDefaultModel, agentPresets, webServer) to
# watch folders and spawn fresh agent sessions, and serves its HTTP API over
# a webServer route, with a client half that registers a full-page management
# surface plus a settings page. It must therefore land in the host
# composition (this insert), never inside an agent preset.

- insert:
    - id: file-events
      name: 'dsh-plugin-file-events'
